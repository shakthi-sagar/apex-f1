name: Pipeline output diff
# Builds a few sample races with the PR's pipeline AND with the base branch, then reports what changed,
# so pipeline changes are visible before merge. pull_request (never pull_request_target): fork PRs run
# their own code with a read-only token and NO secrets, and nothing is uploaded anywhere.
on:
  pull_request:
    paths: ['pipeline/**', '.github/workflows/pipeline-diff.yml']

permissions:
  contents: read

concurrency:
  group: pipeline-diff-${{ github.ref }}
  cancel-in-progress: true

env:
  SAMPLES: '2024:8 2024:16 2023:14' # season:round — Monaco, Monza, Zandvoort: street / fast / high-downforce
  F1SIM_CACHE: ${{ github.workspace }}/.cache

jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { path: head }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.12' }
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache
          key: f1-data-${{ env.SAMPLES }}
      - run: pip install -e head/pipeline
      - name: Generate samples (base, then head)
        id: gen
        continue-on-error: true # F1's archive needs authentication since Oct 2026; see docs/OPERATIONS.md
        run: |
          for side in base head; do
            for s in $SAMPLES; do
              (cd $side/pipeline && python -m f1sim.generate --year "${s%%:*}" --round "${s##*:}" --out "$GITHUB_WORKSPACE/out-$side")
            done
          done
      - name: Diff
        run: |
          if [ "${{ steps.gen.outcome }}" != success ]; then
            printf '%s\n' "## Pipeline output diff" "" "Skipped: the sample races could not be generated here (F1 timing data is unavailable to CI). Run f1sim-generate locally and compare." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          args=""; for s in $SAMPLES; do args="$args --race $s"; done
          python head/pipeline/tools/bundle_diff.py out-base out-head $args | tee -a "$GITHUB_STEP_SUMMARY" > diff.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: pipeline-diff
          path: diff.md
          if-no-files-found: ignore
