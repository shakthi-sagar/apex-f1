name: Generate race
# Started by the Worker (workflow_dispatch API, fine-grained token: Actions write on this repo only) when a
# race is missing or stale, or by rebuild-popular.yml. Runs from the default branch, so contributors cannot
# change what runs with the R2 credentials without a reviewed merge to main.
on:
  workflow_dispatch:
    inputs:
      season: { description: 'Season (e.g. 2024)', required: true }
      round: { description: 'Round number', required: true }
  workflow_call:
    inputs:
      season: { type: string, required: true }
      round: { type: string, required: true }

permissions:
  contents: read

# One build per race, however many people click at once (a second run waits instead of duplicating work).
concurrency:
  group: race-${{ inputs.season }}-${{ inputs.round }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production # holds the R2 / agent secrets; restrict to the main branch in repo settings
    env:
      SEASON: ${{ inputs.season }}
      ROUND: ${{ inputs.round }}
      F1SIM_API: ${{ vars.F1SIM_API }} # https://<your-host>/api
      F1SIM_AGENT_TOKEN: ${{ secrets.F1SIM_AGENT_TOKEN }}
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_PREFIX: ${{ vars.R2_PREFIX }}
      F1SIM_CACHE: ${{ github.workspace }}/.cache
    steps:
      - name: Validate inputs
        run: |
          [[ "$SEASON" =~ ^20[0-9]{2}$ && "$ROUND" =~ ^[0-9]{1,2}$ ]] || { echo "bad season/round"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: pipeline/pyproject.toml }
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .cache
          key: f1-data-${{ env.SEASON }}-${{ env.ROUND }}
          restore-keys: f1-data-
      - run: pip install -e pipeline
      - name: Generate and upload
        run: python -m f1sim.agent --season "$SEASON" --round "$ROUND"
      - name: Report failure to the Worker
        if: failure()
        run: |
          # covers crashes before the pipeline could report (install error, timeout, ...)
          curl -fsS -X POST "$F1SIM_API/agent/progress" -H "authorization: Bearer $F1SIM_AGENT_TOKEN" \
            -H 'content-type: application/json' \
            -d "{\"season\":$SEASON,\"round\":$ROUND,\"state\":\"failed\",\"stage\":\"failed\",\"error\":\"Generator run failed — see GitHub Actions\"}" || true
