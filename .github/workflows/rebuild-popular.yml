name: Rebuild popular races
# Optional batch job: after a pipeline bump, rebuild the races people actually open so nobody waits.
# Everything else rebuilds lazily (stale-while-rebuild) the first time it is opened.
on:
  workflow_dispatch:
    inputs:
      races:
        description: 'season:round list, e.g. "2024:21 2024:8". Empty = pipeline/popular-races.txt'
        required: false

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      races: ${{ steps.m.outputs.races }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: m
        env:
          RACES: ${{ inputs.races }}
        run: |
          list="${RACES:-$(grep -vE '^\s*(#|$)' pipeline/popular-races.txt | tr '\n' ' ')}"
          json=$(for r in $list; do [[ "$r" =~ ^20[0-9]{2}:[0-9]{1,2}$ ]] || { echo "bad entry $r" >&2; exit 1; }; printf '{"season":"%s","round":"%s"},' "${r%%:*}" "${r##*:}"; done)
          echo "races=[${json%,}]" >> "$GITHUB_OUTPUT"
  build:
    needs: matrix
    strategy:
      max-parallel: 3
      fail-fast: false
      matrix:
        race: ${{ fromJSON(needs.matrix.outputs.races) }}
    uses: ./.github/workflows/generate.yml
    with:
      season: ${{ matrix.race.season }}
      round: ${{ matrix.race.round }}
    secrets: inherit
