[project]
name = "f1sim-pipeline"
version = "0.1.0"
description = "FastF1 -> RaceBundle generation pipeline"
requires-python = ">=3.11"
dependencies = [
  "fastf1>=3.8",
  "numpy",
  "scipy",
  "pandas",
  "requests",
  "shapely>=2",
  "boto3",
  "pillow",
  "mapbox-earcut",
]

[project.scripts]
f1sim-generate = "f1sim.generate:main"
f1sim-catalog = "f1sim.catalog:main"
f1sim-agent = "f1sim.agent:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["f1sim*"]
